name: VKA Menu v8 - test raccords panorama

on:
  push:
    branches: [feature/vka-menu-3d-auto-install]
    paths:
      - 'VKA-Minecraft-Menu/**'
      - '.github/workflows/vka-menu-v8-test.yml'

permissions:
  contents: read

concurrency:
  group: vka-menu-v8-panorama-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VKA-Minecraft-Menu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Reconstituer l'illustration centrale VKA et la pierre
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_scene_v5.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Ajouter la vraie extension panoramique générée
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_panorama_v8.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Compiler le mod Minecraft Fabric 26.3
        run: gradle --no-daemon build --stacktrace
      - name: Vérifier le JAR panoramique destiné aux joueurs
        shell: bash
        run: |
          set -euo pipefail
          built=$(find build/libs -maxdepth 1 -name 'vka-menu-3d-client-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          test -s "$built"
          cp "$built" VKA-Menu-3D-CLIENT-26.3-PANORAMA-v8.jar
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import io,zipfile
          fn='VKA-Menu-3D-CLIENT-26.3-PANORAMA-v8.jar'
          with zipfile.ZipFile(fn) as jar:
              tex='assets/vkamenu/textures/gui/'
              pano=Image.open(io.BytesIO(jar.read(tex+'vka_menu_panorama.png'))).convert('RGB')
              center=Image.open(io.BytesIO(jar.read(tex+'vka_menu_hd.png'))).convert('RGB')
              stone=Image.open(io.BytesIO(jar.read(tex+'vka_stone_face.png')))
              assert pano.size==(4464,1882), pano.size
              assert center.size==(3344,1882),center.size
              assert stone.size==(1024,192)
              # Une seule illustration cohérente : pas d'ancienne image collée au milieu.
              import base64, hashlib
              raw=Path('art/vka-panorama-generated.webp.b64').read_text()
              original=Image.open(io.BytesIO(base64.b64decode(''.join(raw.split())))).convert('RGB')
              assert original.size==(1931,814)
              expected=original.resize((4464,1882),Image.Resampling.LANCZOS)
              for area in ((0,0,1200,1882),(3250,0,4464,1882),(0,0,4464,840)):
                  assert ImageChops.difference(pano.crop(area),expected.crop(area)).getbbox() is None, 'Raccord ou doublon de scène détecté'

              assert 'fr/studiovanclaude/vka/menu/VkaMenuScreen.class' in jar.namelist()
              assert not any('vka_button_' in n for n in jar.namelist())
          java=Path('src/client/java/fr/studiovanclaude/vka/menu/VkaMenuScreen.java').read_text()
          assert 'vka_menu_panorama.png' in java
          assert 'final int srcWidth=Math.min(PANORAMA_W,requested)' in java
          assert 'final int sample = 2;' not in java
          assert 'stoneWidth = Math.max(1, w - inset*2)' in java
          assert 'SimpleSoundInstance.forUI' in java
          print('JAR panorama v8 vérifié',fn)
          PY
          sha256sum VKA-Menu-3D-CLIENT-26.3-PANORAMA-v8.jar
          stat -c '%s bytes' VKA-Menu-3D-CLIENT-26.3-PANORAMA-v8.jar
      - name: Conserver le JAR de test v8 (aucun changement du manifeste)
        uses: actions/upload-artifact@v4
        with:
          name: VKA-Menu-v8-SEAMLESS-TEST
          path: VKA-Minecraft-Menu/VKA-Menu-3D-CLIENT-26.3-PANORAMA-v8.jar
          if-no-files-found: error
          retention-days: 14
