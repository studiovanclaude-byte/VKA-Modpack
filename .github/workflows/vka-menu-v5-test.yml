name: VKA Menu v7 - panorama continu et vrais boutons 3D

on:
  push:
    branches: [feature/vka-menu-3d-auto-install]
    paths:
      - 'VKA-Minecraft-Menu/**'
      - '.github/workflows/vka-menu-v5-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VKA-Minecraft-Menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Reconstruire le fond VKA original et son matériau de pierre
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_scene_v5.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Générer le panorama continu depuis la nouvelle illustration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_panorama_v7.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Compiler contre Minecraft Fabric 26.3
        shell: bash
        run: gradle --no-daemon build --stacktrace
      - name: Vérifier image, logo, boutons et ratios d'affichage
        shell: bash
        run: |
          set -euo pipefail
          jarfile=$(find build/libs -maxdepth 1 -name 'vka-menu-3d-client-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          test -s "$jarfile"
          python - "$jarfile" <<'PY'
          import sys,zipfile,io
          from pathlib import Path
          from PIL import Image,ImageChops
          file=sys.argv[1]
          with zipfile.ZipFile(file) as jar:
              members=jar.namelist()
              asset='assets/vkamenu/textures/gui/'
              panorama=Image.open(io.BytesIO(jar.read(asset+'vka_menu_panorama.png'))).convert('RGB')
              center=Image.open(io.BytesIO(jar.read(asset+'vka_menu_hd.png'))).convert('RGB')
              stone=Image.open(io.BytesIO(jar.read(asset+'vka_stone_face.png')))
              assert panorama.size==(4464,1882),panorama.size
              assert center.size==(3344,1882),center.size
              assert stone.size==(1024,192)
              # Panneau VKA original strictement inchangé au centre.
              assert ImageChops.difference(
                  panorama.crop((560+160,0,560+3344-160,1882)),
                  center.crop((160,0,3344-160,1882))).getbbox() is None
              assert not any('vka_button_' in n for n in members)
              assert 'fr/studiovanclaude/vka/menu/VkaMenuScreen.class' in members

          java=Path('src/client/java/fr/studiovanclaude/vka/menu/VkaMenuScreen.java').read_text()
          assert 'vka_menu_panorama.png' in java
          assert 'PANORAMA_W = 4464' in java
          assert 'final int srcWidth=Math.min(PANORAMA_W,requested);' in java
          assert 'final int sample = 2;' not in java, 'Ancien bug de bandes étirées'
          assert 'g.text(this.font,CAPTIONS[index]' in java
          assert 'stoneWidth = Math.max(1, w - inset*2)' in java
          assert 'SimpleSoundInstance.forUI' in java
          assert 'BUTTON_ART' not in java
          for w,h in [(1920,1080),(2560,1080),(3440,1440),(2048,863),(1280,1024)]:
              scale=h/941
              requested=round(w/scale*2)
              source_w=min(4464,requested)
              source_x=(4464-source_w)//2
              assert 0<=source_x and source_x+source_w<=4464
              # Le panneau de titre est dans la zone centrale (400..1250 design).
              left=(w-1672*scale)/2
              assert left+400*scale>0 and left+1250*scale<w,(w,h,left)
              print('OK',w,'x',h,'source',source_x,source_w)
          print('TESTS DU PANORAMA VKA réussis :',file)
          PY
          sha256sum "$jarfile"
      - uses: actions/upload-artifact@v4
        with:
          name: VKA-MENU-V7-PANORAMA-COMPILATION-TEST
          path: VKA-Minecraft-Menu/build/libs/vka-menu-3d-client-*.jar
          retention-days: 14
          if-no-files-found: error
