name: VKA Menu v7 - publier panorama continu

on:
  push:
    branches: [feature/vka-menu-3d-auto-install]
    paths:
      - 'VKA-Minecraft-Menu/**'
      - '.github/workflows/vka-menu-v7-release.yml'

permissions:
  contents: write

concurrency:
  group: vka-menu-v7-panorama-release
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-menu-v7]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VKA-Minecraft-Menu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Reconstituer l'illustration centrale VKA et la pierre
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_scene_v5.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Ajouter la vraie extension panoramique générée
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_panorama_v7.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Compiler le mod Minecraft Fabric 26.3
        run: gradle --no-daemon build --stacktrace
      - name: Vérifier le JAR panoramique destiné aux joueurs
        shell: bash
        run: |
          set -euo pipefail
          built=$(find build/libs -maxdepth 1 -name 'vka-menu-3d-client-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          test -s "$built"
          cp "$built" VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import io,zipfile
          fn='VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar'
          with zipfile.ZipFile(fn) as jar:
              tex='assets/vkamenu/textures/gui/'
              pano=Image.open(io.BytesIO(jar.read(tex+'vka_menu_panorama.png'))).convert('RGB')
              center=Image.open(io.BytesIO(jar.read(tex+'vka_menu_hd.png'))).convert('RGB')
              stone=Image.open(io.BytesIO(jar.read(tex+'vka_stone_face.png')))
              assert pano.size==(4464,1882), pano.size
              assert center.size==(3344,1882),center.size
              assert stone.size==(1024,192)
              assert ImageChops.difference(
                  pano.crop((720,0,3744,1882)),center.crop((160,0,3184,1882))
              ).getbbox() is None,'Panneau d origine modifié'
              assert 'fr/studiovanclaude/vka/menu/VkaMenuScreen.class' in jar.namelist()
              assert not any('vka_button_' in n for n in jar.namelist())
          java=Path('src/client/java/fr/studiovanclaude/vka/menu/VkaMenuScreen.java').read_text()
          assert 'vka_menu_panorama.png' in java
          assert 'final int srcWidth=Math.min(PANORAMA_W,requested)' in java
          assert 'final int sample = 2;' not in java
          assert 'stoneWidth = Math.max(1, w - inset*2)' in java
          assert 'SimpleSoundInstance.forUI' in java
          print('JAR panorama v7 vérifié',fn)
          PY
          sha256sum VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar
          stat -c '%s bytes' VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar
      - name: Publier la Release VKA v7 sans écraser la v6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v2026.11.22-vka-menu-panorama-v7'
          file='VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar'
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p /tmp/vka-menu-published
            gh release download "$tag" --pattern "$file" --dir /tmp/vka-menu-published
            cmp "$file" "/tmp/vka-menu-published/$file"
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" \
              --title 'VKA Menu 3D v7 — vrai panorama sans bandes étirées' \
              --notes 'Client Minecraft 26.3. Nouveau décor panoramique 21:9 généré, illustration originale VKA préservée au centre, cadrage adaptatif sans étirement des bords, boutons 3D interactifs et son de survol conservés.'
          fi
      - name: Vérifier le téléchargement public et l'empreinte du JAR
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${GH_REPO}/releases/download/v2026.11.22-vka-menu-panorama-v7/VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar"
          curl --fail --location --retry 5 --retry-delay 3 --silent --show-error "$url" -o /tmp/vka-panorama-v7-public.jar
          cmp VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar /tmp/vka-panorama-v7-public.jar
      - name: Mettre a jour le manifeste officiel seulement apres les controles
        shell: bash
        run: |
          set -euo pipefail
          size=$(stat -c '%s' VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar)
          sha=$(sha256sum VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar | cut -d' ' -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main
          VKA_JAR_SIZE="$size" VKA_JAR_SHA="$sha" python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('../manifest.json')
          obj=json.loads(p.read_text())
          old='mods/VKA-Menu-3D-CLIENT-26.3-REAL-3D-v6.jar'
          new='mods/VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar'
          if obj['version'] not in ('2026.11.22-test-menu3d.6','2026.11.22-test-menu3d.7'):
              raise SystemExit('Manifeste modpack changé entre-temps : publication bloquée')
          matching=[x for x in obj['files'] if x['path'] in (old,new)]
          if len(matching)!=1:
              raise SystemExit('Un seul ancien JAR de menu doit être présent')
          entry=matching[0]
          entry.update({
              'path':new,
              'url':'https://github.com/studiovanclaude-byte/VKA-Modpack/releases/download/v2026.11.22-vka-menu-panorama-v7/VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar',
              'size':int(os.environ['VKA_JAR_SIZE']),
              'sha256':os.environ['VKA_JAR_SHA']
          })
          obj['version']='2026.11.22-test-menu3d.7'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          print('VKA modpack:',obj['version'],entry['path'],entry['size'],entry['sha256'])
          PY
          git add ../manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'modpack: déployer le véritable panorama VKA sans distorsion'
            git push origin main
          fi
      - name: Conserver l'artefact compilé de la Release
        uses: actions/upload-artifact@v4
        with:
          name: VKA-Menu-v7-PANORAMA-RELEASE
          path: VKA-Minecraft-Menu/VKA-Menu-3D-CLIENT-26.3-PANORAMA-v7.jar
          if-no-files-found: error
          retention-days: 30
