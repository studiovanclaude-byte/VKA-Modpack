name: Publier VKA unifié TEST33.6 + VKA UI RC1

on:
  push:
    branches: [publication/ui-rc1]

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v2026.11.23-ui-rc1
      FICHIER: VKA-Unifie-26.3-TEST33.6-UI-RC1.jar
      SHA256: 531681e1aac88a86b6bcfac939f9705e2b852267278839a7fb82d7955e698631
      TAILLE: '106749910'
    steps:
      - uses: actions/checkout@v4
      - name: Recoller et vérifier le jar
        shell: bash
        run: |
          set -euo pipefail
          cat publication-ui-rc1/"$FICHIER".part* > "$FICHIER"
          test "$(stat -c %s "$FICHIER")" = "$TAILLE"
          echo "$SHA256  $FICHIER" | sha256sum -c -
      - name: Publier la release (une seule fois)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG déjà publiée."
          else
            gh release create "$TAG" "$FICHIER" --target "$GITHUB_SHA" \
              --title "VKA unifié TEST33.6 + VKA UI RC1 — interface VKA (dialogues, journal, registre)" \
              --notes "Version candidate : dialogue Easy NPC à l interface VKA (compat 3.0.4), journal de quêtes et registre Némésis habillés, système graphique VKA UI ; serveur inchangé (Némésis 0.2.4-fortif.3). SHA-256 $SHA256."
          fi
      - name: Vérifier le fichier publié
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o verif.jar "https://github.com/${GH_REPO}/releases/download/${TAG}/${FICHIER}"
          test "$(stat -c %s verif.jar)" = "$TAILLE"
          echo "$SHA256  verif.jar" | sha256sum -c -
