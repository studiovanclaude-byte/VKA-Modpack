name: VKA - Menu plein écran HD et boutons 3D - test

on:
  push:
    branches:
      - feature/vka-menu-3d-auto-install
    paths:
      - 'VKA-Minecraft-Menu/**'
      - '.github/workflows/vka-menu-hd-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VKA-Minecraft-Menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Préparer les ressources graphiques nettes et 3 boutons séparés
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_graphics.py \
            --output src/client/resources/assets/vkamenu/textures/gui
      - name: Compiler et vérifier contre Minecraft Fabric 26.3
        shell: bash
        run: gradle --no-daemon build --stacktrace
      - name: Vérifier les ressources graphiques 2x dans le JAR final
        shell: bash
        run: |
          set -euo pipefail
          final=$(find build/libs -maxdepth 1 -type f -name 'vka-menu-3d-client-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          test -s "$final"
          for asset in vka_menu_hd.png vka_button_0.png vka_button_1.png vka_button_2.png; do
            unzip -Z1 "$final" | grep -qx "assets/vkamenu/textures/gui/$asset"
          done
          python - "$final" <<'PY'
          import sys,zipfile,io,hashlib
          from PIL import Image
          p=sys.argv[1]
          with zipfile.ZipFile(p) as archive:
              base=Image.open(io.BytesIO(archive.read('assets/vkamenu/textures/gui/vka_menu_hd.png')))
              assert base.size==(3344,1882),base.size
              names=archive.namelist()
              assert 'fr/studiovanclaude/vka/menu/VkaMenuScreen.class' in names
          print('JAR vérifié',p,'taille / sha256:',__import__('os').path.getsize(p),hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
      - name: Mettre le JAR Minecraft HD à disposition pour validation
        uses: actions/upload-artifact@v4
        with:
          name: VKA-Menu-3D-HD-26.3-TEST
          path: VKA-Minecraft-Menu/build/libs/vka-menu-3d-client-*.jar
          if-no-files-found: error
          retention-days: 14
