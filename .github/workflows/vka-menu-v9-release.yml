name: VKA Menu v9 - vrais boutons pierre 3D polis

on:
  push:
    branches: [feature/vka-menu-3d-auto-install]
    paths:
      - 'VKA-Minecraft-Menu/**'
      - '.github/workflows/vka-menu-v9-release.yml'

permissions:
  contents: write

concurrency:
  group: vka-menu-v9-polished-release
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-menu-v9]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VKA-Minecraft-Menu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Reconstituer l'illustration centrale VKA et la pierre
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare_buttons_v9.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Ajouter la vraie extension panoramique générée
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_panorama_v9.py --output src/client/resources/assets/vkamenu/textures/gui
      - name: Compiler le mod Minecraft Fabric 26.3
        run: gradle --no-daemon build --stacktrace
      - name: Vérifier le JAR panoramique destiné aux joueurs
        shell: bash
        run: |
          set -euo pipefail
          built=$(find build/libs -maxdepth 1 -name 'vka-menu-3d-client-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          test -s "$built"
          cp "$built" VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,zipfile
          path='VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar'
          prefix='assets/vkamenu/textures/gui/'
          with zipfile.ZipFile(path) as jar:
              assert Image.open(io.BytesIO(jar.read(prefix+'vka_menu_panorama.png'))).size==(4464,1882)
              for state in ('normal','hover','pressed'):
                  sprite=Image.open(io.BytesIO(jar.read(prefix+f'vka_button_{state}.png'))).convert('RGBA')
                  assert sprite.size==(1540,206)
                  assert sprite.getpixel((0,0))[3]==0 and sprite.getpixel((1539,0))[3]==0
              for i in range(3):
                  assert Image.open(io.BytesIO(jar.read(prefix+f'vka_icon_{i}.png'))).size==(128,128)
              assert 'fr/studiovanclaude/vka/menu/VkaMenuScreen.class' in jar.namelist()
              assert not any('vka_stone_face.png' in p for p in jar.namelist())
          java=Path('src/client/java/fr/studiovanclaude/vka/menu/VkaMenuScreen.java').read_text()
          assert 'vka_menu_panorama.png' in java
          assert 'BUTTON_STATES' in java and 'ICONS' in java
          assert 'SimpleSoundInstance.forUI' in java
          assert 'ConnectScreen.startConnecting' in java
          assert 'new OptionsScreen' in java and 'this.minecraft.stop()' in java
          assert 'g.text(this.font,CAPTIONS[index]' in java
          print('Release VKA v9 vérifiée : bouton texturé 3D indépendants, fond propre, interactions conservées')
          PY

          sha256sum VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar
          stat -c '%s bytes' VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar
      - name: Publier la Release VKA v8 sans écraser la v6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='v2026.11.22-vka-menu3d-polished-v9'
          file='VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar'
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p /tmp/vka-menu-published
            gh release download "$tag" --pattern "$file" --dir /tmp/vka-menu-published
            cmp "$file" "/tmp/vka-menu-published/$file"
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" \
              --title 'VKA Menu 3D v9 — boutons pierre biseautés sans bavures' \
              --notes 'Client Minecraft Fabric 26.3 : décor VKA panoramique v8 conservé, résidus des anciens boutons effacés, boutons 3D distincts en pierre taillée avec coins transparents, trois textures normal/survol/enfoncé, icônes nettes et textes natifs. Son et actions conservés.'
          fi
      - name: Vérifier le téléchargement public et l'empreinte du JAR
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${GH_REPO}/releases/download/v2026.11.22-vka-menu3d-polished-v9/VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar"
          curl --fail --location --retry 5 --retry-delay 3 --silent --show-error "$url" -o /tmp/vka-panorama-v8-public.jar
          cmp VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar /tmp/vka-panorama-v8-public.jar
      - name: Mettre a jour le manifeste officiel seulement apres les controles
        shell: bash
        run: |
          set -euo pipefail
          size=$(stat -c '%s' VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar)
          sha=$(sha256sum VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar | cut -d' ' -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main
          VKA_JAR_SIZE="$size" VKA_JAR_SHA="$sha" python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('../manifest.json')
          obj=json.loads(p.read_text())
          old='mods/VKA-Menu-3D-CLIENT-26.3-PANORAMA-v8.jar'
          new='mods/VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar'
          if obj['version'] not in ('2026.11.22-test-menu3d.8','2026.11.22-test-menu3d.9'):
              raise SystemExit('Manifeste modpack changé entre-temps : publication bloquée')
          matching=[x for x in obj['files'] if x['path'] in (old,new)]
          if len(matching)!=1:
              raise SystemExit('Un seul ancien JAR de menu doit être présent')
          entry=matching[0]
          entry.update({
              'path':new,
              'url':'https://github.com/studiovanclaude-byte/VKA-Modpack/releases/download/v2026.11.22-vka-menu3d-polished-v9/VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar',
              'size':int(os.environ['VKA_JAR_SIZE']),
              'sha256':os.environ['VKA_JAR_SHA']
          })
          obj['version']='2026.11.22-test-menu3d.9'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          print('VKA modpack:',obj['version'],entry['path'],entry['size'],entry['sha256'])
          PY
          git add ../manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'modpack: vrais boutons pierre 3D et aucun pixel fantôme v9'
            git push origin main
          fi
      - name: Conserver l'artefact compilé de la Release
        uses: actions/upload-artifact@v4
        with:
          name: VKA-Menu-v9-POLISHED-RELEASE
          path: VKA-Minecraft-Menu/VKA-Menu-3D-CLIENT-26.3-POLISHED-v9.jar
          if-no-files-found: error
          retention-days: 30
