name: Build and publish VKA 3D Minecraft menu (test)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vka-menu-3d-auto-install
    paths:
      - "VKA-Minecraft-Menu/**"
      - ".github/workflows/build-publish-menu3d.yml"

permissions:
  contents: write

jobs:
  package-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VKA-Minecraft-Menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Pillow pour reconstruire la texture approuvée
        run: python -m pip install --disable-pip-version-check pillow
      - name: Vérifier et préparer le véritable visuel VKA
        run: python scripts/prepare_art.py
      - name: Compiler Minecraft 26.3 + Fabric (client uniquement)
        run: gradle --no-daemon build --stacktrace
      - name: Vérifier le JAR client et la texture
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find build/libs -maxdepth 1 -name 'vka-menu-3d-client-*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' | head -1)
          test -s "$jar_file"
          jar tf "$jar_file" | grep -q 'fabric.mod.json'
          jar tf "$jar_file" | grep -q 'assets/vkamenu/textures/gui/vka_menu.png'
          jar tf "$jar_file" | grep -q 'fr/studiovanclaude/vka/menu/VkaMenuScreen.class'
          jar tf "$jar_file" | grep -q 'fr/studiovanclaude/vka/menu/mixin/GuiMixin.class'
          cp "$jar_file" "VKA-Menu-3D-CLIENT-26.3-TEST-REEL.jar"
          sha256sum "VKA-Menu-3D-CLIENT-26.3-TEST-REEL.jar"
          stat -c '%s' "VKA-Menu-3D-CLIENT-26.3-TEST-REEL.jar"
      - name: Publier le JAR dans GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2026.11.22-vka-menu3d"
          asset="VKA-Menu-3D-CLIENT-26.3-TEST-REEL.jar"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La Release existe : aucune modification du fichier existant."
          else
            gh release create "$tag" "$asset" --target "${GITHUB_SHA}" \
              --title "VKA Menu 3D — client Minecraft 26.3" \
              --notes "Menu Minecraft VKA de test : maquette n° 1, boutons 3D interactifs, client seulement. Le launcher installera automatiquement ce mod après mise à jour du manifeste."
          fi
      - name: Vérifier l’asset public avant de modifier le manifeste
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v2026.11.22-vka-menu3d"
          asset="VKA-Menu-3D-CLIENT-26.3-TEST-REEL.jar"
          url="https://github.com/${GH_REPO}/releases/download/${tag}/${asset}"
          curl --retry 3 --retry-delay 3 --fail --location --silent --show-error "$url" -o /tmp/vka-menu-release.jar
          cmp "$asset" /tmp/vka-menu-release.jar
          echo "ASSET_PUBLIC_URL=$url"
          echo "ASSET_SIZE=$(stat -c '%s' "$asset")"
          echo "ASSET_SHA256=$(sha256sum "$asset" | cut -d' ' -f1)"
          echo "La Release est téléchargeable et identique à la compilation."
      - name: Conserver le JAR de compilation
        uses: actions/upload-artifact@v4
        with:
          name: VKA-Menu-3D-26.3-RELEASE-CANDIDATE
          path: VKA-Minecraft-Menu/VKA-Menu-3D-CLIENT-26.3-TEST-REEL.jar
          retention-days: 30
          if-no-files-found: error
