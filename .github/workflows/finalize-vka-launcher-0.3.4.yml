name: Finaliser publication VKA Luncher 0.3.4 dans launcher

on:
  push:
    branches: [feature/vka-menu-3d-auto-install]
    paths: ['.github/workflows/finalize-vka-launcher-0.3.4.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: vka-luncher-v0.3.4
      ASSET: VKA-Luncher-Setup-0.3.4.exe
      SHA: 0d38cb9de32b4dc1dfb979752fb94a4b731caf09a8ab6ea7ae7594ba0216074f
      BYTES: '120657342'
    steps:
      - uses: actions/checkout@v4
      - name: Verify draft, rename installer, publish update
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          found=$(echo "$releases" | jq -c --arg tag "$TAG" '.[] | select(.tag_name==$tag)')
          test -n "$found" || { echo 'Release brouillon introuvable';exit 1; }
          release_id=$(echo "$found" | jq -r .id)
          count=$(echo "$found" | jq '[.assets[]] | length')
          test "$count" = '1' || { echo "Assets inattendus: $count";exit 1; }
          asset=$(echo "$found" | jq -c '.assets[0]')
          asset_id=$(echo "$asset" | jq -r .id)
          size=$(echo "$asset" | jq -r .size)
          digest=$(echo "$asset" | jq -r .digest)
          test "$size" = "$BYTES" || { echo 'Taille incorrecte';exit 1; }
          test "$digest" = "sha256:$SHA" || { echo 'SHA256 incorrect';exit 1; }
          current_name=$(echo "$asset" | jq -r .name)
          if [ "$current_name" != "$ASSET" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -f name="$ASSET" >/dev/null
          fi
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")
          echo "$release" | jq -e --arg name "$ASSET" --arg sha "sha256:$SHA" \
            '.assets|length==1 and .[0].name==$name and .[0].digest==$sha' >/dev/null
          if [ "$(echo "$release" | jq -r .draft)" = 'true' ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false >/dev/null
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          echo "$published" | jq -e --arg name "$ASSET" --arg sha "sha256:$SHA" --argjson bytes "$BYTES" \
            '.draft==false and .prerelease==false and (.assets|length)==1 and .assets[0].name==$name and .assets[0].digest==$sha and .assets[0].size==$bytes' >/dev/null
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          url=$(echo "$published" | jq -r '.assets[0].browser_download_url')
          test "$url" = "$expected_url" || { echo "URL de téléchargement inattendue: $url";exit 1; }
          echo "VKA LUNCHER OFFICIEL 0.3.4 PUBLIC"
          echo "$url"
          echo "$SHA"
